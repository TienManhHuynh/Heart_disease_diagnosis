[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-project"
version = "0.1.0"
description = "Reproducible Cleveland Heart Disease ML project, reports and Streamlit demo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
all = ["xgboost>=2.0", "shap>=0.43", "streamlit>=1.28", "jupyterlab>=4", "ipykernel>=6"]
report = ["reportlab>=4.0", "pypdf>=4.0", "pillow>=10"]
dev = ["ruff==0.17.3"]

[project.scripts]
heart-project = "heart_disease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".local", "tmp", "output", "artifacts", "reports", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/check_project.py" = ["E402"]
"scripts/verify_delivery.py" = ["E402"]


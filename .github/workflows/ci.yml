name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src scripts tests app.py
      - name: Check formatting
        run: python -m ruff format --check src scripts tests app.py
      - name: Validate data, source, notebooks and unit tests
        run: python scripts/check_project.py
